<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>REEO circuit wordmark</title>
  <style>
    @font-face {
      font-family: Circuit;
      src: url('./REEOCircuitDisplay.ttf');
    }
    @font-face {
      font-family: Alan;
      src: url('../fonts/alan-sans/AlanSans-Variable.ttf');
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #111;
      color: #ddd;
      background-image: radial-gradient(#333 1px, transparent 1px);
      background-size: 40px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    h1 {
      font: 270px Circuit;
      margin: 0;
      line-height: 1.15;
      font-weight: 400;
    }
    p {
      font: 32px Alan;
      margin: 24px 0 16px;
    }
    small {
      font: 20px Alan;
      color: #888;
      letter-spacing: 3px;
    }
  </style>
  <body>
    <h1>REEO</h1>
    <p>Digital logic. Limitless curiosity.</p>
    <small>BUILD · CONNECT · SIMULATE</small>
  </body>
</html>
