version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      runtime-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
